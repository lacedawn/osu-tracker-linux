name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Build Linux x64
      run: |
        dotnet publish circle-tracker.csproj -c Release -r linux-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:Version="${{ steps.version.outputs.VERSION }}" \
          -o ./publish/linux-x64
    
    - name: Build Windows x64
      run: |
        dotnet publish circle-tracker.csproj -c Release -r win-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:Version="${{ steps.version.outputs.VERSION }}" \
          -o ./publish/win-x64
    
    - name: Build macOS x64
      run: |
        dotnet publish circle-tracker.csproj -c Release -r osx-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:Version="${{ steps.version.outputs.VERSION }}" \
          -o ./publish/osx-x64
    
    - name: Build macOS ARM64
      run: |
        dotnet publish circle-tracker.csproj -c Release -r osx-arm64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:Version="${{ steps.version.outputs.VERSION }}" \
          -o ./publish/osx-arm64
    
    - name: Create archives
      run: |
        cd publish
        tar -czf circle-tracker-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz linux-x64/
        cd win-x64 && zip -r ../circle-tracker-${{ steps.version.outputs.VERSION }}-win-x64.zip . && cd ..
        tar -czf circle-tracker-${{ steps.version.outputs.VERSION }}-osx-x64.tar.gz osx-x64/
        tar -czf circle-tracker-${{ steps.version.outputs.VERSION }}-osx-arm64.tar.gz osx-arm64/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          publish/*.tar.gz
          publish/*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
